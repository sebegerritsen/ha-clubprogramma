blueprint:
  name: LISA – notify on activity changes
  description: >-
    Sends a notification to a phone when a family member's training, match or team event is
    cancelled, back on, rescheduled, or gets a new meet time. Uses the *Activity update* entity
    of the LISA integration.
  domain: automation
  source_url: https://github.com/sebegerritsen/ha-lisa/blob/main/blueprints/automation/lisa/activity_update_notify.yaml
  input:
    update_entity:
      name: Activity update entity
      selector:
        entity:
          filter:
            - integration: lisa
              domain: event
    notify_device:
      name: Phone
      selector:
        device:
          filter:
            - integration: mobile_app
    event_types:
      name: Changes to notify about
      default: [cancelled, reinstated, rescheduled, meeting_time_changed]
      selector:
        select:
          multiple: true
          options:
            - label: Cancelled
              value: cancelled
            - label: Back on
              value: reinstated
            - label: Rescheduled
              value: rescheduled
            - label: New meet time
              value: meeting_time_changed
    language:
      name: Language of the notification
      default: nl
      selector:
        select:
          options:
            - label: Nederlands
              value: nl
            - label: English
              value: en

mode: queued
max: 10

triggers:
  - trigger: state
    entity_id: !input update_entity

variables:
  event_types: !input event_types
  lang: !input language
  a: "{{ trigger.to_state.attributes if trigger.to_state else {} }}"
  type: "{{ a.event_type | default('') }}"
  days: >-
    {{ ['ma', 'di', 'wo', 'do', 'vr', 'za', 'zo'] if lang == 'nl'
       else ['Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat', 'Sun'] }}
  start: >-
    {% set d = as_local(as_datetime(a.start)) if a.start else none %}
    {{ days[d.weekday()] ~ ' ' ~ d.strftime('%d-%m %H:%M') if d else '' }}
  previous_start: >-
    {% set d = as_local(as_datetime(a.previous_start)) if a.previous_start else none %}
    {{ days[d.weekday()] ~ ' ' ~ d.strftime('%d-%m %H:%M') if d else '' }}
  meet: "{{ as_local(as_datetime(a.meeting_time)).strftime('%H:%M') if a.meeting_time else '' }}"
  previous_meet: >-
    {{ as_local(as_datetime(a.previous_meeting_time)).strftime('%H:%M') if a.previous_meeting_time else '' }}
  labels: >-
    {{ {'cancelled': 'Afgelast', 'reinstated': 'Gaat toch door', 'rescheduled': 'Verplaatst',
        'meeting_time_changed': 'Andere verzameltijd'} if lang == 'nl'
       else {'cancelled': 'Cancelled', 'reinstated': 'Back on', 'rescheduled': 'Rescheduled',
        'meeting_time_changed': 'New meet time'} }}

conditions:
  - condition: template
    value_template: >-
      {{ trigger.from_state is not none
         and trigger.from_state.state != 'unavailable'
         and trigger.to_state is not none
         and trigger.to_state.state not in ['unknown', 'unavailable']
         and type in event_types }}

actions:
  - device_id: !input notify_device
    domain: mobile_app
    type: notify
    title: "{{ labels[type] | default(type) }}: {{ a.title }} ({{ a.member }})"
    message: >-
      {% if type == 'rescheduled' %}{{ start }} (was {{ previous_start }})
      {%- elif type == 'meeting_time_changed' %}{{ 'Verzamelen' if lang == 'nl' else 'Meet at' }} {{ meet }} (was {{ previous_meet }}) · {{ start }}
      {%- else %}{{ start }}{% endif %}
      {%- if a.location %} · {{ a.location }}{% endif %}
